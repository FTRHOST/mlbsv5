<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div
    class="play-offs-v-1"
    style="
      background: url(play-offs-v-1.png) center;
      background-size: cover;
      background-repeat: no-repeat;
    "
  >
    <div class="footer"></div>
    <div class="logo-container">
      <img class="logo-intechfest-2" src="logo-intechfest-20.png" />
      <div class="ellipse-7"></div>
      <div class="ellipse-8"></div>
    </div>
    <div class="bracket-container">
      <div class="bracket-column">
        <div class="match-column">
          <div class="m-1-m-2">
            <div class="team-container">
              <div class="m-1">
                <div class="team-bracket">
                  <div class="team-name">TIM 1</div>
                </div>
                <div class="team-bracket">
                  <div class="team-name">TIM 2</div>
                </div>
              </div>
              <div class="m-1">
                <div class="team-bracket">
                  <div class="team-name">TIM 3</div>
                </div>
                <div class="team-bracket">
                  <div class="team-name">TIM 4</div>
                </div>
              </div>
            </div>
            <div class="bracket-connector">
              <img
                class="bracket-connector-piece"
                src="bracket-connector-piece0.svg"
              />
              <img
                class="bracket-connector-piece2"
                src="bracket-connector-piece1.svg"
              />
            </div>
          </div>
          <div class="m-3-m-4">
            <div class="team-container">
              <div class="m-3">
                <div class="team-bracket">
                  <div class="team-name">TIM 5</div>
                </div>
                <div class="team-bracket">
                  <div class="team-name">WINNER M1</div>
                </div>
              </div>
              <div class="m-4">
                <div class="team-bracket">
                  <div class="team-name">TIM 6</div>
                </div>
                <div class="team-bracket">
                  <div class="team-name">WINNER M2</div>
                </div>
              </div>
            </div>
            <img class="bracket-connector2" src="bracket-connector1.svg" />
          </div>
          <div class="m-6">
            <div class="m-5">
              <div class="team-bracket">
                <div class="team-name">WINNER M3</div>
              </div>
              <div class="team-bracket">
                <div class="team-name">WINNER M4</div>
              </div>
            </div>
          </div>
        </div>
        <div class="match-column">
          <div class="peyisihan">
            <div class="m-5">
              <div class="team-bracket">
                <div class="team-name">LOSER M3</div>
              </div>
              <div class="team-bracket">
                <div class="team-name">LOSER M4</div>
              </div>
            </div>
            <img class="bracket-connector3" src="bracket-connector2.svg" />
          </div>
          <div class="peyisihan2">
            <div class="m-7">
              <div class="team-bracket">
                <div class="team-name">LOSER M6</div>
              </div>
              <div class="team-bracket">
                <div class="team-name">WINNER M5</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <img class="bracket-connector4" src="bracket-connector3.svg" />
      <div class="grandfinal">
        <div class="judul-m">
          <div class="date">21 OKTOBER 2026</div>
          <div class="event-name">AUDIT K3</div>
        </div>
        <div class="m-8">
          <div class="team-bracket">
            <div class="team-name">WINNER M6</div>
          </div>
          <div class="team-bracket">
            <div class="team-name">WINNER M7</div>
          </div>
        </div>
      </div>
    </div>
    <div class="header">
      <div class="bracket-title-container">
        <div class="playoffs-bracket">PLAYOFFS BRACKET</div>
      </div>
      <div class="event-title-container">
        <div class="intechfest">INTECHFEST</div>
      </div>
    </div>
  </div>
  
</body>
</html>
